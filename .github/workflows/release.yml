name: Build and publish release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Check release version
        shell: bash
        run: |
          version="$(cat VERSION)"
          if [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo 'Run this workflow on the release tag matching VERSION.' >&2
            exit 1
          fi
          test -f "docs/releases/v$version.md"
      - run: python -m unittest discover -s tests
      - run: node adapters/dsh/self-test.mjs
      - run: node adapters/dsh/web-test.mjs

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-14
            platform: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          python -m pip install pyinstaller==6.16.0
          call tools\build_exe.bat
          if errorlevel 1 exit /b 1
          python tools\smoke_packaged.py
          if errorlevel 1 exit /b 1
          python tools\package_release.py windows-x64
      - name: Build macOS universal
        if: runner.os == 'macOS'
        env:
          COMI_PET_ARCH: universal
        run: |
          zsh tools/build_macos.sh
          python tools/package_release.py macos-universal
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.platform }}
          path: dist/ComiPet-*.zip
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          root = Path('release-assets')
          archives = sorted(root.glob('ComiPet-*.zip'))
          assert len(archives) == 2, 'Both platform archives are required'
          (root / 'SHA256SUMS.txt').write_text(''.join(
              hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name + '\n'
              for path in archives), encoding='utf-8')
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          gh release create "$tag" --verify-tag --draft --title "Comi Pet $tag" --notes-file "docs/releases/$tag.md"
          gh release upload "$tag" release-assets/*
          gh release edit "$tag" --draft=false --latest
